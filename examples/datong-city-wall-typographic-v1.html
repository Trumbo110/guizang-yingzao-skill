<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>大同城墙无引线排版垫图</title>
  <style>
    @font-face {
      font-family: "Puhui Local";
      src: local("Alibaba PuHuiTi 3.0 55 Regular"), local("Alibaba PuHuiTi 3.0");
      font-weight: 400;
    }
    @font-face {
      font-family: "Puhui Local";
      src: local("Alibaba PuHuiTi 3.0 95 ExtraBold"), local("Alibaba PuHuiTi 3.0");
      font-weight: 800;
    }

    :root {
      --sky: #cbdde5;
      --ink: #111b1d;
      --stone: #8d7a61;
      --stone-light: #b8a98d;
      --city: #aeb8b5;
      --cream: #efe6cf;
      --accent: #d2432f;
      --ochre: #cf9640;
      --margin: 94px;
      --col: 208px;
      --gutter: 20px;
      --baseline: 32px;
      --c1: 94px;
      --c2: 322px;
      --c3: 550px;
      --c4: 778px;
      --c5: 1006px;
      --c6: 1234px;
    }

    * { box-sizing: border-box; }
    html, body { width: 1536px; height: 2048px; margin: 0; overflow: hidden; }
    body { background: var(--sky); }

    .poster {
      position: relative;
      width: 1536px;
      height: 2048px;
      overflow: hidden;
      isolation: isolate;
      background: var(--sky);
      color: var(--ink);
    }

    .text { position: absolute; }

    .year {
      left: 54px;
      top: 96px;
      z-index: 1;
      color: rgba(207,150,64,.38);
      font-family: "Bodoni 72", Didot, "Times New Roman", serif;
      font-size: 292px;
      font-weight: 700;
      line-height: .78;
      letter-spacing: -.075em;
      white-space: nowrap;
    }

    .year-note {
      left: var(--c1);
      top: 340px;
      z-index: 6;
      color: var(--ink);
      font: 800 17px/1 "Puhui Local", "Hiragino Sans GB", sans-serif;
      letter-spacing: .16em;
      white-space: nowrap;
    }

    .latin {
      left: var(--c2);
      top: 500px;
      z-index: 1;
      width: 1050px;
      color: rgba(17,27,29,.16);
      font-family: "Puhui Local", Arial, sans-serif;
      font-size: 118px;
      font-weight: 800;
      line-height: .78;
      letter-spacing: -.055em;
      white-space: nowrap;
    }

    .latin span {
      display: block;
      margin-top: 50px;
      margin-left: 8px;
      font-size: 62px;
      font-weight: 400;
      letter-spacing: .22em;
    }

    .modern-city {
      position: absolute;
      left: 238px;
      right: 136px;
      top: 716px;
      z-index: 2;
      height: 300px;
      opacity: .76;
    }

    .modern-city i {
      position: absolute;
      bottom: 0;
      display: block;
      background: var(--city);
    }

    .modern-city i:nth-child(1) { left: 0; width: 160px; height: 210px; }
    .modern-city i:nth-child(2) { left: 184px; width: 110px; height: 136px; }
    .modern-city i:nth-child(3) { left: 320px; width: 140px; height: 178px; }
    .modern-city i:nth-child(4) { left: 490px; width: 122px; height: 128px; }
    .modern-city i:nth-child(5) { left: 640px; width: 176px; height: 238px; }
    .modern-city i:nth-child(6) { left: 848px; width: 118px; height: 160px; }

    .tower {
      position: absolute;
      left: 508px;
      top: 702px;
      z-index: 4;
      width: 660px;
      height: 660px;
    }

    .tower .body {
      position: absolute;
      left: 152px;
      top: 222px;
      width: 360px;
      height: 360px;
      background: var(--stone);
      clip-path: polygon(8% 0, 92% 0, 96% 100%, 4% 100%);
    }

    .tower .upper {
      position: absolute;
      left: 198px;
      top: 96px;
      width: 268px;
      height: 208px;
      background: var(--stone-light);
      clip-path: polygon(10% 18%, 50% 0, 90% 18%, 100% 30%, 88% 34%, 88% 100%, 12% 100%, 12% 34%, 0 30%);
    }

    .tower .roof-one,
    .tower .roof-two {
      position: absolute;
      left: 44px;
      width: 570px;
      height: 120px;
      background: var(--ink);
      clip-path: polygon(0 72%, 12% 60%, 42% 40%, 50% 8%, 58% 40%, 88% 60%, 100% 72%, 84% 78%, 16% 78%);
    }

    .tower .roof-one { top: 46px; }
    .tower .roof-two { top: 236px; transform: scaleX(1.08); }

    .wall {
      position: absolute;
      left: 260px;
      right: 0;
      top: 1220px;
      z-index: 4;
      height: 318px;
      background: var(--stone);
      transform: skewY(-4deg);
    }

    .tree {
      position: absolute;
      z-index: 5;
      background: var(--ink);
      transform-origin: center;
    }

    .trunk-right {
      right: -80px;
      top: -80px;
      width: 344px;
      height: 1440px;
      clip-path: polygon(38% 0, 100% 0, 100% 100%, 12% 100%, 28% 75%, 18% 56%, 32% 34%);
    }

    .branch-a { left: 530px; top: 76px; width: 1020px; height: 118px; border-radius: 70px; transform: rotate(26deg); }
    .branch-b { left: -160px; top: 234px; width: 920px; height: 84px; border-radius: 52px; transform: rotate(12deg); }
    .branch-c { left: -190px; top: 480px; width: 710px; height: 78px; border-radius: 48px; transform: rotate(4deg); }
    .branch-d { left: 980px; top: 390px; width: 680px; height: 76px; border-radius: 46px; transform: rotate(-24deg); }
    .branch-e { left: 870px; top: 18px; width: 490px; height: 66px; border-radius: 42px; transform: rotate(-44deg); }

    .canopy-left {
      left: -120px;
      top: -140px;
      width: 760px;
      height: 420px;
      border-radius: 48% 52% 58% 42%;
      transform: rotate(-8deg);
    }

    .foreground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      height: 720px;
      background: var(--ink);
      clip-path: polygon(0 24%, 17% 16%, 30% 27%, 43% 12%, 58% 26%, 72% 14%, 84% 22%, 100% 12%, 100% 100%, 0 100%);
    }

    .main-title {
      left: 72px;
      top: 674px;
      z-index: 8;
      width: 220px;
      height: 800px;
      color: var(--accent);
      font-family: "Songti SC", STSong, serif;
      font-size: 164px;
      font-weight: 900;
      line-height: .95;
      letter-spacing: .015em;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
    }

    .place {
      left: var(--c2);
      top: 760px;
      z-index: 8;
      color: var(--ink);
      font: 800 20px/1.5 "Puhui Local", "Hiragino Sans GB", sans-serif;
      letter-spacing: .15em;
    }

    .place span {
      display: block;
      margin-top: 8px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 400;
      letter-spacing: .18em;
    }

    .gates {
      right: 86px;
      top: 550px;
      z-index: 8;
      height: 590px;
      color: var(--cream);
      font-family: "Songti SC", STSong, serif;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.85;
      letter-spacing: .16em;
      writing-mode: vertical-rl;
      text-orientation: upright;
    }

    .gates small {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--ochre);
      font: 800 14px/1 "Puhui Local", sans-serif;
      letter-spacing: .18em;
    }

    .terms {
      left: var(--c4);
      bottom: 172px;
      z-index: 8;
      color: var(--cream);
      font-family: "Songti SC", STSong, serif;
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .18em;
      white-space: nowrap;
    }

    .terms span {
      display: block;
      margin-top: 18px;
      color: rgba(239,230,207,.64);
      font: 400 15px/1 "Puhui Local", sans-serif;
      letter-spacing: .22em;
    }

    .corner-meta {
      left: var(--c1);
      bottom: 78px;
      z-index: 8;
      color: var(--cream);
      font: 400 15px/1.4 "Puhui Local", "Hiragino Sans GB", sans-serif;
      letter-spacing: .16em;
    }

    .grid {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      opacity: .44;
      background-image:
        repeating-linear-gradient(
          to right,
          transparent 0,
          transparent var(--col),
          rgba(255,255,255,.9) var(--col),
          rgba(255,255,255,.9) calc(var(--col) + 2px),
          rgba(210,67,47,.14) calc(var(--col) + 2px),
          rgba(210,67,47,.14) calc(var(--col) + var(--gutter)),
          transparent calc(var(--col) + var(--gutter))
        );
      background-size: calc(var(--col) + var(--gutter)) 100%;
      background-position: var(--margin) 0;
      clip-path: inset(0 var(--margin));
    }

    .grid::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 14px;
      bottom: 14px;
      background-image: linear-gradient(to bottom, rgba(255,255,255,.34) 1px, transparent 1px);
      background-size: 100% var(--baseline);
    }

    body.debug .text { outline: 2px solid rgba(255,244,0,.9); outline-offset: 5px; }
  </style>
</head>
<body>
  <main class="poster" aria-label="大同城墙无引线排版垫图">
    <div class="text year">1372</div>
    <div class="text year-note">明 · 洪武五年 / MING</div>
    <div class="text latin">DATONG<span>CITY WALL</span></div>

    <div class="modern-city" aria-label="现代城市背景占位">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>

    <div class="tower" aria-label="城楼占位，仅控制位置与体量">
      <div class="body"></div>
      <div class="upper"></div>
      <div class="roof-one"></div>
      <div class="roof-two"></div>
    </div>
    <div class="wall"></div>

    <div class="tree canopy-left"></div>
    <div class="tree trunk-right"></div>
    <div class="tree branch-a"></div>
    <div class="tree branch-b"></div>
    <div class="tree branch-c"></div>
    <div class="tree branch-d"></div>
    <div class="tree branch-e"></div>
    <div class="foreground"></div>

    <div class="text main-title">大同城墙</div>
    <div class="text place">山西 · 大同<span>DATONG · SHANXI</span></div>

    <div class="text gates"><small>古城四门</small>和阳　永泰　清远　武定</div>

    <div class="text terms">城楼　城垣　雉堞<span>CITY TOWER · RAMPART · BATTLEMENT</span></div>
    <div class="text corner-meta">枝影入城 · 古今同框<br>DATONG CITY WALL / 01</div>

    <div class="grid" hidden></div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("grid") === "1") {
      document.querySelector(".grid").hidden = false;
      document.body.classList.add("debug");
    }
    document.fonts.ready.then(() => document.body.dataset.fontsReady = "true");
  </script>
</body>
</html>
