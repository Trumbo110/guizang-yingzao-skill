<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>大同圣母圣心堂主题文字排版垫图</title>
  <style>
    :root {
      --night: #101c1d;
      --night-blue: #17282a;
      --stone: #c6d1c9;
      --stone-light: #e8e3cf;
      --stone-dark: #788f88;
      --amber: #d58a32;
      --amber-deep: #a8532e;
      --tree: #102d26;
      --ink: #071010;
      --margin: 72px;
      --col: 215.333px;
      --gutter: 20px;
      --c1: 72px;
      --c2: 307.333px;
      --c3: 542.666px;
      --c4: 778px;
      --c5: 1013.333px;
      --c6: 1248.666px;
    }

    * { box-sizing: border-box; }
    html, body { width: 1536px; height: 2048px; margin: 0; overflow: hidden; }
    body { background: var(--night); }

    .poster {
      position: relative;
      width: 1536px;
      height: 2048px;
      overflow: hidden;
      isolation: isolate;
      color: var(--stone-light);
      background:
        radial-gradient(circle at 70% 31%, rgba(66,97,94,.28), transparent 34%),
        linear-gradient(164deg, var(--night-blue), var(--night) 54%, #0b1515);
    }

    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: .20;
      background-image:
        radial-gradient(circle, rgba(232,227,207,.34) 0 1px, transparent 1.2px),
        radial-gradient(circle, rgba(5,16,16,.7) 0 1px, transparent 1.3px);
      background-position: 0 0, 4px 4px;
      background-size: 9px 9px, 13px 13px;
      mix-blend-mode: soft-light;
    }

    .text { position: absolute; }

    .year {
      left: 42px;
      top: 54px;
      z-index: 1;
      color: rgba(213,138,50,.72);
      font-family: "Bodoni 72", Didot, "Times New Roman", serif;
      font-size: 330px;
      font-weight: 700;
      line-height: .82;
      letter-spacing: -.075em;
      white-space: nowrap;
    }

    .year-note {
      left: var(--c1);
      top: 346px;
      z-index: 8;
      color: var(--stone-light);
      font-family: "Hiragino Sans GB", "Heiti SC", sans-serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .16em;
      white-space: nowrap;
    }

    .location {
      right: var(--margin);
      top: 78px;
      z-index: 8;
      color: var(--stone-light);
      font-family: "Hiragino Sans GB", "Heiti SC", sans-serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .18em;
      white-space: nowrap;
    }

    .latin {
      left: var(--c2);
      top: 430px;
      z-index: 1;
      color: rgba(198,209,201,.16);
      font-family: "Arial Narrow", "Helvetica Neue", sans-serif;
      font-size: 190px;
      font-weight: 700;
      line-height: .79;
      letter-spacing: -.045em;
      white-space: nowrap;
    }

    .latin .heart {
      display: block;
      margin-left: 232px;
      margin-top: 54px;
      color: rgba(198,209,201,.25);
    }

    .latin .cathedral {
      display: block;
      margin-left: 2px;
      margin-top: 70px;
      color: rgba(213,138,50,.27);
      font-family: "Bodoni 72", Didot, serif;
      font-size: 105px;
      font-weight: 400;
      letter-spacing: .10em;
    }

    .tower {
      position: absolute;
      z-index: 4;
      filter: drop-shadow(20px 28px 0 rgba(4,12,12,.34));
    }

    .tower .shaft {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 78%;
      height: 74%;
      transform: translateX(-50%);
      background: var(--stone);
      clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%);
    }

    .tower .cornice {
      position: absolute;
      left: 8%;
      top: 25%;
      width: 84%;
      height: 7%;
      background: var(--stone-dark);
    }

    .tower .dome {
      position: absolute;
      left: 12%;
      top: 8%;
      width: 76%;
      height: 24%;
      border-radius: 50% 50% 12% 12% / 72% 72% 18% 18%;
      background: var(--stone-dark);
    }

    .tower .arch {
      position: absolute;
      left: 32%;
      top: 47%;
      width: 36%;
      height: 28%;
      border-radius: 48% 48% 8% 8% / 36% 36% 8% 8%;
      background: var(--ink);
      box-shadow: inset 0 0 0 16px rgba(213,138,50,.7);
    }

    .tower .panel {
      position: absolute;
      left: 24%;
      top: 35%;
      width: 52%;
      height: 8%;
      background: var(--stone-light);
      opacity: .7;
    }

    .tower .cross-v,
    .tower .cross-h {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      background: var(--amber);
    }

    .tower .cross-v { width: 15px; height: 106px; }
    .tower .cross-h { top: 30px; width: 68px; height: 15px; }

    .tower-a {
      left: 330px;
      top: 226px;
      width: 660px;
      height: 1392px;
    }

    .tower-b {
      left: 876px;
      top: 568px;
      width: 470px;
      height: 1028px;
      filter: drop-shadow(16px 24px 0 rgba(4,12,12,.30));
    }

    .main-title {
      left: 56px;
      top: 574px;
      z-index: 9;
      height: 828px;
      color: var(--amber);
      font-family: "Songti SC", STSong, serif;
      font-size: 132px;
      font-weight: 900;
      line-height: .94;
      letter-spacing: .04em;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
      text-shadow: 9px 8px 0 rgba(7,16,16,.48);
    }

    .trees {
      position: absolute;
      inset: auto 0 0;
      z-index: 6;
      height: 800px;
      overflow: hidden;
    }

    .tree {
      position: absolute;
      background: var(--tree);
      border-radius: 47% 53% 43% 57%;
      box-shadow: inset 0 -80px 0 rgba(7,16,16,.55);
    }

    .tree-a { left: -120px; bottom: -160px; width: 850px; height: 700px; transform: rotate(8deg); }
    .tree-b { left: 470px; bottom: -190px; width: 760px; height: 760px; transform: rotate(-7deg); }
    .tree-c { right: -220px; bottom: -120px; width: 780px; height: 830px; transform: rotate(9deg); }

    .tree-glow {
      position: absolute;
      left: 190px;
      right: 130px;
      bottom: 0;
      height: 470px;
      opacity: .56;
      background: radial-gradient(ellipse at 45% 70%, rgba(213,138,50,.8), transparent 55%);
      mix-blend-mode: screen;
    }

    .place {
      left: var(--c2);
      top: 1664px;
      z-index: 10;
      color: var(--stone-light);
      font-family: "Songti SC", STSong, serif;
      font-size: 82px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .terms {
      left: var(--c2);
      top: 1786px;
      z-index: 10;
      color: var(--stone-light);
      font-family: "Hiragino Sans GB", "Heiti SC", sans-serif;
      font-size: 28px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: .16em;
      white-space: nowrap;
    }

    .terms-en {
      left: var(--c2);
      top: 1844px;
      z-index: 10;
      color: var(--amber);
      font-family: "Arial Narrow", "Helvetica Neue", sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .17em;
      white-space: nowrap;
    }

    .address {
      right: var(--margin);
      bottom: 78px;
      z-index: 10;
      color: rgba(232,227,207,.72);
      font-family: "Arial Narrow", "Helvetica Neue", sans-serif;
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .17em;
      white-space: nowrap;
    }

    .grid {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      background:
        repeating-linear-gradient(to bottom, rgba(255,84,84,.28) 0 1px, transparent 1px 32px),
        linear-gradient(to right,
          transparent 0 72px,
          rgba(0,255,255,.14) 72px 287.333px,
          transparent 287.333px 307.333px,
          rgba(0,255,255,.14) 307.333px 522.666px,
          transparent 522.666px 542.666px,
          rgba(0,255,255,.14) 542.666px 758px,
          transparent 758px 778px,
          rgba(0,255,255,.14) 778px 993.333px,
          transparent 993.333px 1013.333px,
          rgba(0,255,255,.14) 1013.333px 1228.666px,
          transparent 1228.666px 1248.666px,
          rgba(0,255,255,.14) 1248.666px 1464px,
          transparent 1464px 100%);
    }

    .grid::before,
    .grid::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(255,220,0,.78);
    }

    .grid::before { left: var(--margin); }
    .grid::after { right: var(--margin); }

    body.show-grid .grid { display: block; }

    /* V2 palette: intentionally leaves the photographed black sky behind. */
    body.palette-oxide { background: #ad563e; }

    body.palette-oxide .poster {
      --stone: #e6d8ba;
      --stone-light: #f2ead5;
      --stone-dark: #547274;
      --tree: #18312d;
      --ink: #0d2223;
      background:
        radial-gradient(circle at 72% 30%, rgba(239,190,130,.25), transparent 34%),
        radial-gradient(circle at 20% 72%, rgba(116,44,39,.20), transparent 42%),
        #b75b3f;
    }

    body.palette-oxide .poster::after {
      opacity: .30;
      background-image:
        radial-gradient(circle, rgba(246,225,190,.42) 0 1px, transparent 1.3px),
        radial-gradient(circle, rgba(76,26,25,.50) 0 1px, transparent 1.2px);
      background-size: 8px 8px, 13px 13px;
      mix-blend-mode: multiply;
    }

    body.palette-oxide .year,
    body.palette-oxide .main-title {
      color: #112b2c;
    }

    body.palette-oxide .terms-en { color: #df955e; }

    body.palette-oxide .main-title {
      text-shadow: 9px 8px 0 rgba(242,234,213,.24);
    }

    body.palette-oxide .latin { color: rgba(17,43,44,.19); }
    body.palette-oxide .latin .heart { color: rgba(17,43,44,.27); }
    body.palette-oxide .latin .cathedral { color: rgba(242,234,213,.34); }
    body.palette-oxide .tower .cross-v,
    body.palette-oxide .tower .cross-h { background: var(--stone-light); }
    body.palette-oxide .tree-glow {
      background: radial-gradient(ellipse at 45% 70%, rgba(236,177,91,.72), transparent 56%);
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="大同圣母圣心堂主题文字海报排版垫图">
    <div class="text year">1906</div>
    <div class="text year-note">重建 · REBUILT</div>
    <div class="text location">山西 · 大同 · 都司街</div>

    <div class="text latin">
      SACRED
      <span class="heart">HEART</span>
      <span class="cathedral">CATHEDRAL</span>
    </div>

    <div class="tower tower-a" aria-hidden="true">
      <div class="cross-v"></div><div class="cross-h"></div>
      <div class="dome"></div><div class="shaft"></div>
      <div class="cornice"></div><div class="panel"></div><div class="arch"></div>
    </div>
    <div class="tower tower-b" aria-hidden="true">
      <div class="cross-v"></div><div class="cross-h"></div>
      <div class="dome"></div><div class="shaft"></div>
      <div class="cornice"></div><div class="panel"></div><div class="arch"></div>
    </div>

    <div class="text main-title">圣母圣心堂</div>

    <div class="trees" aria-hidden="true">
      <div class="tree tree-a"></div><div class="tree tree-b"></div><div class="tree tree-c"></div>
      <div class="tree-glow"></div>
    </div>

    <div class="text place">大同古城</div>
    <div class="text terms">双钟楼　拱券　古城夜色</div>
    <div class="text terms-en">TWIN BELL TOWERS · ARCHES · NIGHT</div>
    <div class="text address">DATONG · DUSI STREET NO. 4</div>
    <div class="grid" aria-hidden="true"></div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('grid') === '1') document.body.classList.add('show-grid');
    if (params.get('palette') === 'oxide') document.body.classList.add('palette-oxide');
    document.fonts.ready.then(() => { document.body.dataset.fontsReady = 'true'; });
  </script>
</body>
</html>
