<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>太平楼 V4 编辑排版垫图</title>
  <style>
    @font-face {
      font-family: "Puhui Local";
      src: local("Alibaba PuHuiTi 3.0 55 Regular"), local("Alibaba PuHuiTi 3.0");
      font-weight: 400;
    }
    @font-face {
      font-family: "Puhui Local";
      src: local("Alibaba PuHuiTi 3.0 95 ExtraBold"), local("Alibaba PuHuiTi 3.0");
      font-weight: 800;
    }

    :root {
      --canvas: #d8e3df;
      --ink: #17292e;
      --accent: #c53f2d;
      --paper: #eee8d7;
      --placeholder: #677575;
      --placeholder-dark: #465658;
      --margin: 94px;
      --col: 208px;
      --gutter: 20px;
      --baseline: 32px;
      --c1: 94px;
      --c2: 322px;
      --c3: 550px;
      --c4: 778px;
      --c5: 1006px;
      --c6: 1234px;
    }

    * { box-sizing: border-box; }
    html, body { width: 1536px; height: 2048px; margin: 0; overflow: hidden; }
    body { background: var(--canvas); }

    .poster {
      position: relative;
      width: 1536px;
      height: 2048px;
      overflow: hidden;
      isolation: isolate;
      color: var(--ink);
      background: var(--canvas);
    }

    .text { position: absolute; }

    .top-index {
      left: var(--c1);
      top: 56px;
      z-index: 8;
      font: 800 18px/1 "Puhui Local", "Hiragino Sans GB", sans-serif;
      letter-spacing: .18em;
      white-space: nowrap;
    }

    .top-fact {
      left: var(--c5);
      top: 56px;
      z-index: 8;
      width: 436px;
      text-align: right;
      font: 400 17px/1 "Puhui Local", "Hiragino Sans GB", sans-serif;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .structural {
      left: 72px;
      top: 130px;
      z-index: 1;
      width: 1270px;
      color: rgba(23,41,46,.16);
      font-family: "Puhui Local", "Arial Narrow", Arial, sans-serif;
      font-size: 188px;
      font-weight: 800;
      line-height: .72;
      letter-spacing: -.065em;
      white-space: nowrap;
    }

    .structural .tower {
      display: block;
      margin-top: 62px;
      margin-left: 6px;
      font-size: 86px;
      font-weight: 400;
      letter-spacing: .22em;
      line-height: 1;
    }

    .main-title {
      left: 58px;
      top: 494px;
      z-index: 2;
      width: 234px;
      height: 700px;
      color: var(--accent);
      font-family: "Songti SC", STSong, serif;
      font-size: 212px;
      font-weight: 900;
      line-height: .94;
      letter-spacing: .012em;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
    }

    .place {
      left: var(--c2);
      top: 480px;
      z-index: 8;
      width: 436px;
      font-family: "Puhui Local", "Hiragino Sans GB", sans-serif;
    }

    .place strong {
      display: block;
      font-size: 27px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: .12em;
    }

    .place span {
      display: block;
      margin-top: 16px;
      font-size: 19px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: .12em;
    }

    .history {
      left: var(--c2);
      top: 578px;
      z-index: 8;
      width: 380px;
      height: auto;
      color: var(--ink);
      font: 400 19px/1.6 "Songti SC", STSong, serif;
      letter-spacing: .08em;
    }

    .history::before {
      content: "";
      display: block;
      width: 64px;
      height: 3px;
      margin-bottom: 16px;
      background: var(--accent);
    }

    .architecture-zone {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      clip-path: polygon(
        88% 0, 100% 0, 100% 100%, 21% 100%,
        20% 91%, 0 83%, 0 72%, 28% 66%,
        25% 57%, 18% 51%, 22% 44%, 52% 40%,
        66% 31%, 79% 12%
      );
      background: var(--placeholder);
    }

    .architecture-zone::before,
    .architecture-zone::after,
    .architecture-zone .eave-band {
      content: "";
      position: absolute;
      left: -150px;
      width: 1810px;
      height: 118px;
      transform: rotate(-13.5deg);
      transform-origin: center;
      background: var(--placeholder-dark);
    }

    .architecture-zone::before { top: 700px; }
    .architecture-zone::after { top: 1144px; }
    .architecture-zone .eave-band { top: 1572px; }

    .note {
      z-index: 9;
      font-family: "Puhui Local", "Hiragino Sans GB", sans-serif;
      background: transparent;
    }

    .note .index {
      display: block;
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 15px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: .16em;
    }

    .note .name {
      display: block;
      font-family: "Songti SC", STSong, serif;
      font-size: 40px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: .08em;
    }

    .note .detail {
      display: block;
      margin-top: 9px;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: .16em;
      white-space: nowrap;
    }

    .dougong {
      left: var(--c3);
      top: 842px;
      width: 208px;
      color: var(--paper);
    }

    .roof {
      left: var(--c3);
      top: 354px;
      width: 320px;
      color: var(--ink);
    }

    .dougong .index,
    .eaves .index { color: var(--paper); }

    .eaves {
      left: var(--c5);
      top: 1018px;
      width: 310px;
      color: var(--paper);
    }

    .eaves .name { font-size: 36px; }

    .leaders {
      position: absolute;
      inset: 0;
      z-index: 8;
      width: 1536px;
      height: 2048px;
      pointer-events: none;
    }

    .leaders polyline {
      fill: none;
      stroke-width: 2;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .leaders .dark { stroke: var(--ink); }
    .leaders .light { stroke: var(--paper); }
    .leaders circle { fill: var(--accent); stroke: var(--paper); stroke-width: 2; }

    .plaque {
      left: var(--c5);
      top: 708px;
      z-index: 9;
      color: var(--paper);
      font-family: "Puhui Local", "Hiragino Sans GB", sans-serif;
    }

    .plaque span {
      display: block;
      font-size: 14px;
      line-height: 1;
      letter-spacing: .16em;
    }

    .plaque strong {
      display: block;
      margin-top: 12px;
      font-family: "Songti SC", STSong, serif;
      font-size: 32px;
      line-height: 1;
      letter-spacing: .12em;
    }

    .bottom-index {
      left: var(--c1);
      bottom: 66px;
      z-index: 9;
      color: var(--paper);
      font: 400 15px/1.5 "Puhui Local", "Hiragino Sans GB", sans-serif;
      letter-spacing: .12em;
    }

    .bottom-type {
      right: 88px;
      bottom: 54px;
      z-index: 9;
      color: rgba(238,232,215,.42);
      font: 800 88px/.8 "Puhui Local", Arial, sans-serif;
      letter-spacing: -.03em;
    }

    .grid {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      opacity: .46;
      background-image:
        repeating-linear-gradient(
          to right,
          transparent 0,
          transparent var(--col),
          rgba(255,255,255,.9) var(--col),
          rgba(255,255,255,.9) calc(var(--col) + 2px),
          rgba(197,63,45,.14) calc(var(--col) + 2px),
          rgba(197,63,45,.14) calc(var(--col) + var(--gutter)),
          transparent calc(var(--col) + var(--gutter))
        );
      background-size: calc(var(--col) + var(--gutter)) 100%;
      background-position: var(--margin) 0;
      clip-path: inset(0 var(--margin));
    }

    .grid::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 14px;
      bottom: 14px;
      background-image: linear-gradient(to bottom, rgba(255,255,255,.38) 1px, transparent 1px);
      background-size: 100% var(--baseline);
    }

    body.debug .text,
    body.debug .note {
      outline: 2px solid rgba(255,244,0,.9);
      outline-offset: 5px;
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="太平楼 V4 编辑排版垫图">
    <div class="text top-index">DATONG · SHANXI / EAST LANDMARK / 01</div>
    <div class="text top-fact">和阳街 × 太平街</div>

    <div class="text structural">TAIPING<span class="tower">TOWER</span></div>
    <div class="text main-title">太平楼</div>

    <div class="text place">
      <strong>大同古城 · 东部标志性节点</strong>
      <span>DATONG ANCIENT CITY</span>
    </div>

    <div class="text history">太平楼始建于明代，现存建筑为当代复建。</div>

    <div class="architecture-zone" aria-label="建筑占位，仅控制轮廓与三组檐口"><div class="eave-band"></div></div>

    <div class="text note dougong">
      <span class="index">01 / 构件</span>
      <span class="name">斗拱</span>
      <span class="detail">DOUGONG · 托起外檐</span>
    </div>

    <div class="text note roof">
      <span class="index">02 / 屋顶形制</span>
      <span class="name">十字歇山顶</span>
      <span class="detail">CROSS XIESHAN ROOF</span>
    </div>

    <div class="text note eaves">
      <span class="index">03 / 楼阁节奏</span>
      <span class="name">三层三檐</span>
      <span class="detail">THREE EAVE LEVELS</span>
    </div>

    <div class="text plaque">
      <span>照片可见匾额 / INSCRIPTION</span>
      <strong>四海升平</strong>
    </div>

    <svg class="leaders" viewBox="0 0 1536 2048" aria-hidden="true">
      <polyline class="dark" points="742,918 790,918 790,842 840,842"></polyline>
      <circle cx="840" cy="842" r="6"></circle>
      <polyline class="dark" points="870,426 960,426 960,310 1182,310"></polyline>
      <circle cx="1182" cy="310" r="6"></circle>
      <polyline class="light" points="1006,1110 936,1110 936,1080 862,1080"></polyline>
      <circle cx="862" cy="1080" r="6"></circle>
    </svg>

    <div class="text bottom-index">明代始建 · 当代复建<br>视觉观察与公开资料交叉核对</div>
    <div class="text bottom-type">03 / 03</div>
    <div class="grid" hidden></div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("grid") === "1") {
      document.querySelector(".grid").hidden = false;
      document.body.classList.add("debug");
    }
    document.fonts.ready.then(() => document.body.dataset.fontsReady = "true");
  </script>
</body>
</html>
