<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>太平楼混合排版测试</title>
  <style>
    @font-face {
      font-family: "Puhui Local";
      src: local("Alibaba PuHuiTi 3.0 55 Regular"), local("Alibaba PuHuiTi 3.0");
      font-weight: 400;
    }
    @font-face {
      font-family: "Puhui Local";
      src: local("Alibaba PuHuiTi 3.0 95 ExtraBold"), local("Alibaba PuHuiTi 3.0");
      font-weight: 800;
    }

    :root {
      --paper: #dce6e6;
      --ink: #13272d;
      --accent: #b7352d;
      --cream: #efe6d5;
      --margin: 88px;
      --column: 210px;
      --gutter: 20px;
    }

    * { box-sizing: border-box; }
    html, body { width: 1536px; height: 2048px; margin: 0; overflow: hidden; }
    body { background: var(--paper); }

    .poster {
      position: relative;
      width: 1536px;
      height: 2048px;
      overflow: hidden;
      background: var(--paper);
      isolation: isolate;
    }

    .photo {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    .paper-wash {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(220,230,230,.08), rgba(16,34,39,.04)),
        radial-gradient(circle at 18% 18%, rgba(239,230,213,.10), transparent 38%);
      mix-blend-mode: soft-light;
    }

    .sky-clip {
      position: absolute;
      inset: 0;
      z-index: 2;
      clip-path: polygon(0 0, 90% 0, 61% 28%, 23% 39%, 0 42%);
      pointer-events: none;
    }

    .structural-type {
      position: absolute;
      left: var(--margin);
      top: 116px;
      width: 1170px;
      color: rgba(19,39,45,.18);
      font-family: "Puhui Local", "Helvetica Neue", Arial, sans-serif;
      font-size: 178px;
      font-weight: 800;
      line-height: .76;
      letter-spacing: -.055em;
      white-space: nowrap;
    }

    .structural-type span {
      display: block;
      margin-top: 46px;
      font-size: 226px;
      letter-spacing: -.07em;
    }

    .top-meta {
      position: absolute;
      left: var(--margin);
      top: 58px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 22px;
      color: var(--ink);
      font-family: "Puhui Local", "Hiragino Sans GB", sans-serif;
      font-size: 21px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .top-meta::after {
      content: "";
      display: block;
      width: 428px;
      height: 2px;
      background: currentColor;
      opacity: .75;
    }

    .title {
      position: absolute;
      left: var(--margin);
      top: 432px;
      z-index: 6;
      width: 226px;
      height: 720px;
      color: var(--accent);
      font-family: "Songti SC", STSong, serif;
      font-size: 222px;
      font-weight: 900;
      line-height: .94;
      letter-spacing: .015em;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
    }

    .place-label {
      position: absolute;
      left: 338px;
      top: 440px;
      z-index: 7;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 17px;
      color: var(--ink);
      font-family: "Puhui Local", "Hiragino Sans GB", sans-serif;
      font-size: 27px;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: .17em;
      writing-mode: vertical-rl;
    }

    .place-label::before {
      content: "";
      display: block;
      width: 2px;
      height: 96px;
      background: var(--accent);
    }

    .functional-rule {
      position: absolute;
      left: var(--margin);
      top: 368px;
      z-index: 5;
      width: 670px;
      height: 2px;
      background: var(--ink);
      opacity: .8;
    }

    .functional-rule::after {
      content: "";
      position: absolute;
      right: 0;
      top: -7px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
    }

    .grid {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: .36;
      background-image:
        linear-gradient(to right,
          transparent 0,
          transparent var(--margin),
          rgba(255,255,255,.9) var(--margin),
          rgba(255,255,255,.9) calc(var(--margin) + 1px),
          transparent calc(var(--margin) + 1px),
          transparent calc(var(--margin) + var(--column)),
          rgba(255,255,255,.9) calc(var(--margin) + var(--column)),
          rgba(255,255,255,.9) calc(var(--margin) + var(--column) + 1px),
          transparent calc(var(--margin) + var(--column) + 1px));
      background-size: calc(var(--column) + var(--gutter)) 100%;
    }

    .grid::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 58px;
      bottom: 58px;
      background-image: linear-gradient(to bottom, rgba(255,255,255,.36) 1px, transparent 1px);
      background-size: 100% 32px;
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="太平楼编辑海报">
    <div class="photo"></div>
    <div class="paper-wash"></div>
    <div class="sky-clip"><div class="structural-type">TAIPING<span>LOU</span></div></div>
    <div class="top-meta">DATONG ANCIENT CITY · 01</div>
    <div class="functional-rule"></div>
    <div class="title">太平楼</div>
    <div class="place-label">大同古城</div>
    <div class="grid" hidden></div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const image = params.get("image");
    if (image) document.querySelector(".photo").style.backgroundImage = `url("${image}")`;
    if (params.get("grid") === "1") document.querySelector(".grid").hidden = false;
  </script>
</body>
</html>
