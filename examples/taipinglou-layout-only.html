<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>太平楼纯排版垫图</title>
  <style>
    @font-face {
      font-family: "Puhui Local";
      src: local("Alibaba PuHuiTi 3.0 55 Regular"), local("Alibaba PuHuiTi 3.0");
      font-weight: 400;
    }
    @font-face {
      font-family: "Puhui Local";
      src: local("Alibaba PuHuiTi 3.0 95 ExtraBold"), local("Alibaba PuHuiTi 3.0");
      font-weight: 800;
    }

    :root {
      --canvas: #e5e7e4;
      --ink: #1d292c;
      --accent: #b7352d;
      --placeholder: #747b7b;
      --placeholder-dark: #4f5758;
      --margin: 88px;
      --column: 210px;
      --gutter: 20px;
    }

    * { box-sizing: border-box; }
    html, body { width: 1536px; height: 2048px; margin: 0; overflow: hidden; }
    body { background: var(--canvas); }

    .poster {
      position: relative;
      width: 1536px;
      height: 2048px;
      overflow: hidden;
      background: var(--canvas);
      isolation: isolate;
    }

    .structural-type {
      position: absolute;
      left: var(--margin);
      top: 116px;
      z-index: 1;
      color: rgba(29,41,44,.18);
      font-family: "Puhui Local", "Helvetica Neue", Arial, sans-serif;
      font-size: 178px;
      font-weight: 800;
      line-height: .76;
      letter-spacing: -.055em;
      white-space: nowrap;
    }

    .structural-type span {
      display: block;
      margin-top: 46px;
      font-size: 226px;
      letter-spacing: -.07em;
    }

    .architecture-zone {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      clip-path: polygon(
        90% 0, 100% 0, 100% 100%, 24% 100%,
        22% 88%, 0 80%, 0 70%, 29% 67%,
        25% 51%, 17% 45%, 21% 39%, 52% 35%,
        66% 26%, 79% 11%
      );
      background: var(--placeholder);
    }

    .architecture-zone::before,
    .architecture-zone::after,
    .eave-band {
      content: "";
      position: absolute;
      left: -120px;
      width: 1760px;
      height: 118px;
      background: var(--placeholder-dark);
      transform-origin: center;
      transform: rotate(-13.5deg);
    }

    .architecture-zone::before { top: 690px; }
    .architecture-zone::after { top: 1120px; }
    .eave-band { top: 1515px; }

    .top-meta {
      position: absolute;
      left: var(--margin);
      top: 58px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 22px;
      color: var(--ink);
      font-family: "Puhui Local", "Hiragino Sans GB", sans-serif;
      font-size: 21px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .top-meta::after {
      content: "";
      display: block;
      width: 428px;
      height: 2px;
      background: currentColor;
    }

    .functional-rule {
      position: absolute;
      left: var(--margin);
      top: 368px;
      z-index: 5;
      width: 670px;
      height: 2px;
      background: var(--ink);
    }

    .functional-rule::after {
      content: "";
      position: absolute;
      right: 0;
      top: -7px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
    }

    .title {
      position: absolute;
      left: var(--margin);
      top: 432px;
      z-index: 6;
      width: 226px;
      height: 720px;
      color: var(--accent);
      font-family: "Songti SC", STSong, serif;
      font-size: 222px;
      font-weight: 900;
      line-height: .94;
      letter-spacing: .015em;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
    }

    .place-label {
      position: absolute;
      left: 338px;
      top: 440px;
      z-index: 7;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 17px;
      color: var(--ink);
      font-family: "Puhui Local", "Hiragino Sans GB", sans-serif;
      font-size: 27px;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: .17em;
      writing-mode: vertical-rl;
    }

    .place-label::before {
      content: "";
      display: block;
      width: 2px;
      height: 96px;
      background: var(--accent);
    }

    .grid {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: .36;
      background-image:
        linear-gradient(to right,
          transparent 0,
          transparent var(--margin),
          rgba(255,255,255,.9) var(--margin),
          rgba(255,255,255,.9) calc(var(--margin) + 1px),
          transparent calc(var(--margin) + 1px),
          transparent calc(var(--margin) + var(--column)),
          rgba(255,255,255,.9) calc(var(--margin) + var(--column)),
          rgba(255,255,255,.9) calc(var(--margin) + var(--column) + 1px),
          transparent calc(var(--margin) + var(--column) + 1px));
      background-size: calc(var(--column) + var(--gutter)) 100%;
    }

    .grid::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 58px;
      bottom: 58px;
      background-image: linear-gradient(to bottom, rgba(255,255,255,.36) 1px, transparent 1px);
      background-size: 100% 32px;
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="太平楼纯排版垫图">
    <div class="structural-type">TAIPING<span>LOU</span></div>
    <div class="architecture-zone"><div class="eave-band"></div></div>
    <div class="top-meta">DATONG ANCIENT CITY · 01</div>
    <div class="functional-rule"></div>
    <div class="title">太平楼</div>
    <div class="place-label">大同古城</div>
    <div class="grid" hidden></div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("grid") === "1") document.querySelector(".grid").hidden = false;
  </script>
</body>
</html>
