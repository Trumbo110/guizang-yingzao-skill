<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>应县木塔主题文字排版垫图</title>
  <style>
    :root {
      --paper: #c9d9d6;
      --paper-deep: #b8cbc7;
      --ink: #162523;
      --wood-dark: #2d2922;
      --wood: #77533a;
      --wood-light: #b98758;
      --cream: #f0e4c7;
      --accent: #c83f2d;
      --ochre: #c49a61;
      --tree: #17362f;
      --margin: 86px;
      --col: 211px;
      --gutter: 20px;
      --baseline: 32px;
      --c1: 86px;
      --c2: 317px;
      --c3: 548px;
      --c4: 779px;
      --c5: 1010px;
      --c6: 1241px;
    }

    * { box-sizing: border-box; }
    html, body { width: 1536px; height: 2048px; margin: 0; overflow: hidden; }
    body { background: var(--paper); }

    .poster {
      position: relative;
      width: 1536px;
      height: 2048px;
      overflow: hidden;
      isolation: isolate;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 10%, rgba(255,255,255,.18), transparent 32%),
        var(--paper);
    }

    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: .18;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(22,37,35,.25) 0 1px, transparent 1.2px),
        radial-gradient(circle at 75% 60%, rgba(240,228,199,.5) 0 1px, transparent 1.4px);
      background-size: 7px 7px, 11px 11px;
      mix-blend-mode: multiply;
    }

    .text { position: absolute; }

    .year {
      left: 34px;
      top: 42px;
      z-index: 1;
      color: rgba(196,154,97,.56);
      font-family: "Bodoni 72", Didot, "Times New Roman", serif;
      font-size: 304px;
      font-weight: 700;
      line-height: .82;
      letter-spacing: -.075em;
      white-space: nowrap;
    }

    .year-note {
      left: var(--c1);
      top: 314px;
      z-index: 7;
      color: var(--ink);
      font-family: "Hiragino Sans GB", "Heiti SC", sans-serif;
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: .18em;
      white-space: nowrap;
    }

    .latin {
      left: var(--c2);
      top: 520px;
      z-index: 1;
      color: rgba(22,37,35,.14);
      font-family: "Arial Narrow", "Helvetica Neue", sans-serif;
      font-size: 196px;
      font-weight: 700;
      line-height: .76;
      letter-spacing: -.045em;
      white-space: nowrap;
    }

    .latin span {
      display: block;
      margin-top: 58px;
      margin-left: 10px;
      font-size: 78px;
      font-weight: 400;
      letter-spacing: .15em;
    }

    .tower {
      position: absolute;
      left: 48px;
      top: 136px;
      z-index: 4;
      width: 1440px;
      height: 1790px;
      filter: drop-shadow(0 24px 0 rgba(22,37,35,.12));
    }

    .tower .body {
      position: absolute;
      left: 396px;
      top: 194px;
      width: 650px;
      height: 1480px;
      background: var(--wood);
      clip-path: polygon(12% 0, 88% 0, 95% 100%, 5% 100%);
    }

    .tower .core {
      position: absolute;
      left: 530px;
      top: 220px;
      width: 380px;
      height: 1360px;
      opacity: .7;
      background: var(--wood-light);
      clip-path: polygon(14% 0, 86% 0, 92% 100%, 8% 100%);
    }

    .tower .roof {
      position: absolute;
      left: 70px;
      width: 1300px;
      height: 174px;
      background: var(--wood-dark);
      clip-path: polygon(5% 66%, 18% 58%, 39% 36%, 46% 12%, 54% 12%, 61% 36%, 82% 58%, 95% 66%, 88% 77%, 12% 77%);
    }

    .tower .roof::after {
      content: "";
      position: absolute;
      left: 17%;
      right: 17%;
      top: 64%;
      height: 12%;
      background: var(--wood-light);
      opacity: .9;
    }

    .tower .roof-1 { top: 0; transform: scaleX(.78); }
    .tower .roof-2 { top: 270px; transform: scaleX(.88); }
    .tower .roof-3 { top: 566px; transform: scaleX(.97); }
    .tower .roof-4 { top: 884px; transform: scaleX(1.04); }
    .tower .roof-5 { top: 1216px; transform: scaleX(1.1); }
    .tower .roof-6 { top: 1515px; transform: scaleX(1.15); }

    .tower .band {
      position: absolute;
      left: 430px;
      width: 580px;
      height: 72px;
      background: var(--wood-light);
      opacity: .78;
    }

    .tower .band-1 { top: 192px; }
    .tower .band-2 { top: 494px; }
    .tower .band-3 { top: 808px; }
    .tower .band-4 { top: 1138px; }
    .tower .band-5 { top: 1450px; }

    .pagoda-name {
      right: 82px;
      top: 392px;
      z-index: 9;
      height: 620px;
      color: var(--cream);
      font-family: "Hiragino Sans GB", "Heiti SC", sans-serif;
      font-size: 28px;
      font-weight: 600;
      line-height: 1.85;
      letter-spacing: .16em;
      writing-mode: vertical-rl;
      text-orientation: upright;
    }

    .location {
      right: 82px;
      top: 102px;
      z-index: 8;
      color: var(--ink);
      font-family: "Hiragino Sans GB", "Heiti SC", sans-serif;
      font-size: 17px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: .16em;
      white-space: nowrap;
    }

    .main-title {
      left: 54px;
      top: 640px;
      z-index: 9;
      height: 790px;
      color: var(--accent);
      font-family: "Songti SC", STSong, serif;
      font-size: 154px;
      font-weight: 900;
      line-height: .94;
      letter-spacing: .015em;
      writing-mode: vertical-rl;
      text-orientation: upright;
      white-space: nowrap;
    }

    .foliage {
      position: absolute;
      z-index: 6;
      background: var(--tree);
    }

    .foliage-left {
      left: -150px;
      bottom: -150px;
      width: 920px;
      height: 780px;
      border-radius: 48% 52% 44% 56%;
      transform: rotate(8deg);
    }

    .foliage-right {
      right: -170px;
      bottom: -130px;
      width: 900px;
      height: 1120px;
      border-radius: 57% 43% 50% 50%;
      transform: rotate(-5deg);
    }

    .foliage-mid {
      left: 430px;
      bottom: -210px;
      width: 760px;
      height: 660px;
      border-radius: 52% 48% 45% 55%;
    }

    .terms {
      left: var(--c3);
      bottom: 166px;
      z-index: 9;
      color: var(--cream);
      font-family: "Songti SC", STSong, serif;
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .17em;
      white-space: nowrap;
    }

    .terms span {
      display: block;
      margin-top: 18px;
      color: rgba(240,228,199,.66);
      font-family: "Arial Narrow", "Helvetica Neue", sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: .22em;
    }

    .grid {
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      opacity: .52;
      background-image:
        repeating-linear-gradient(
          to right,
          transparent 0,
          transparent var(--col),
          rgba(255,255,255,.9) var(--col),
          rgba(255,255,255,.9) calc(var(--col) + 2px),
          rgba(200,63,45,.16) calc(var(--col) + 2px),
          rgba(200,63,45,.16) calc(var(--col) + var(--gutter)),
          transparent calc(var(--col) + var(--gutter))
        );
      background-size: calc(var(--col) + var(--gutter)) 100%;
      background-position: var(--margin) 0;
      clip-path: inset(0 var(--margin));
    }

    .grid::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(to bottom, rgba(255,255,255,.34) 1px, transparent 1px);
      background-size: 100% var(--baseline);
    }

    body.debug .text { outline: 2px solid rgba(255,244,0,.95); outline-offset: 6px; }
  </style>
</head>
<body>
  <main class="poster" aria-label="应县木塔无可见线条主题文字海报排版垫图">
    <div class="text year">1056</div>
    <div class="text year-note">辽 · 清宁二年</div>
    <div class="text location">山西 · 朔州 · 应县</div>
    <div class="text latin">YINGXIAN<span>WOODEN PAGODA</span></div>

    <div class="tower" aria-label="木塔中轴占位，仅约束真实照片主体的位置与体量">
      <div class="body"></div>
      <div class="core"></div>
      <div class="roof roof-1"></div>
      <div class="roof roof-2"></div>
      <div class="roof roof-3"></div>
      <div class="roof roof-4"></div>
      <div class="roof roof-5"></div>
      <div class="roof roof-6"></div>
      <div class="band band-1"></div>
      <div class="band band-2"></div>
      <div class="band band-3"></div>
      <div class="band band-4"></div>
      <div class="band band-5"></div>
    </div>

    <div class="foliage foliage-left"></div>
    <div class="foliage foliage-right"></div>
    <div class="foliage foliage-mid"></div>

    <div class="text main-title">应县木塔</div>
    <div class="text pagoda-name">佛宫寺释迦塔</div>
    <div class="text terms">五层六檐　纯木楼阁<span>FIVE STOREYS · SIX EAVES</span></div>

    <div class="grid" hidden></div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("grid") === "1") {
      document.querySelector(".grid").hidden = false;
      document.body.classList.add("debug");
    }
    document.fonts.ready.then(() => document.body.dataset.fontsReady = "true");
  </script>
</body>
</html>
